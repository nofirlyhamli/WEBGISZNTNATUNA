        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }

<!-- Tambahan kontrol layer dan pelacakan lokasi seperti Google Maps -->
<script>
    // === Kontrol Pilihan Layer ===
    var baseMaps = {
        "Google Satellite": layer_GoogleSatellite_0
    };

    var overlayMaps = {
        "ZNT Pembaruan Natuna": layer_ZNTPEMBARUANNATUNA_1,
        "Ranai Kota": layer_RANAI_KOTA_2,
        "Batu Hitam": layer_BATU_HITAM_3,
        "Bandarsyah": layer_BANDARSYAH_4,
        "Ranai Darat": layer_RANAI_DARAT_5
    };

    L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

    // === Pelacakan Lokasi Realtime seperti Google Maps ===
    var userMarker, accuracyCircle, watchID;

    function startTracking() {
        if (!navigator.geolocation) {
            alert("Browser Anda tidak mendukung pelacakan lokasi.");
            return;
        }

        watchID = navigator.geolocation.watchPosition(
            function (position) {
                var lat = position.coords.latitude;
                var lon = position.coords.longitude;
                var accuracy = position.coords.accuracy;

                if (userMarker) {
                    userMarker.setLatLng([lat, lon]);
                    accuracyCircle.setLatLng([lat, lon]).setRadius(accuracy);
                } else {
                    userMarker = L.marker([lat, lon], {icon: L.icon({
                        iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
                        iconSize: [32, 32],
                        iconAnchor: [16, 32],
                        popupAnchor: [0, -30]
                    })}).addTo(map)
                    .bindPopup("<b>Lokasi Anda</b><br>Lat: " + lat.toFixed(5) + ", Lon: " + lon.toFixed(5))
                    .openPopup();

                    accuracyCircle = L.circle([lat, lon], {
                        radius: accuracy,
                        color: '#136AEC',
                        fillColor: '#136AEC',
                        fillOpacity: 0.2
                    }).addTo(map);

                    map.setView([lat, lon], 16);
                }
            },
            function (error) {
                alert("Gagal mendapatkan lokasi: " + error.message);
            },
            {
                enableHighAccuracy: true,
                maximumAge: 10000,
                timeout: 10000
            }
        );
    }

    function stopTracking() {
        if (watchID) {
            navigator.geolocation.clearWatch(watchID);
            watchID = null;
            if (userMarker) map.removeLayer(userMarker);
            if (accuracyCircle) map.removeLayer(accuracyCircle);
            alert("Pelacakan lokasi dihentikan.");
        }
    }

    // Tambahkan tombol toggle pelacakan
    L.easyButton('fa-location-arrow', function(btn, map){
        if (watchID) {
            stopTracking();
            btn.button.style.backgroundColor = '';
        } else {
            startTracking();
            btn.button.style.backgroundColor = '#00b894';
        }
    }, 'Aktifkan/Nonaktifkan Pelacakan Lokasi').addTo(map);
</script>
